[tool.poetry]
name = "crewai-hierarchical-planning"
version = "0.1.0"
description = "The hierarchical / supervisor multi-agent architecture with planning in CrewAI: a manager agent delegates to four specialists (sandboxed market-data tool, safe calculator, copywriter, QA critic) under Process.hierarchical with planning=True, producing a guardrail-validated Pydantic launch brief; a CrewAI Flow routes by complexity, asks a human with @human_feedback and re-validates. Telemetry off, runs 100% locally on ollama."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/crewai-hierarchical-planning"
repository = "https://github.com/MartinCastroAlvarez/crewai-hierarchical-planning"
documentation = "https://github.com/MartinCastroAlvarez/crewai-hierarchical-planning#readme"
keywords = [
    "crewai",
    "multi-agent",
    "hierarchical",
    "supervisor",
    "planning",
    "crewai-flows",
    "human-in-the-loop",
    "guardrails",
    "ollama",
    "agentic-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
packages = [{ include = "hierarchical_crew" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
launch-crew = "hierarchical_crew.cli:main"
launch-crew-bench = "hierarchical_crew.bench:main"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
crewai = ">=1.15.30,<2"
pydantic = ">=2.11.9,<2.13"
anthropic = { version = ">=0.73,<2.2", optional = true }

[tool.poetry.extras]
anthropic = ["anthropic"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff - lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
    "ASYNC",        # async pitfalls
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S311", "E501"]
"examples/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["hierarchical_crew", "tests", "examples"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=hierarchical_crew",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # CrewAI's own internals touch its deprecated fields (function_calling_llm, ...).
    "ignore::DeprecationWarning:crewai.*",
    # CrewAI rebinds a submodule name while importing (crewai.rag.embeddings).
    "ignore::ImportWarning",
]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["hierarchical_crew"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
omit = [
    "hierarchical_crew/__main__.py",
]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "build", "dist"]
