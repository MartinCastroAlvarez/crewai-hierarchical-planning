name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --all-extras
      - name: ruff check
        run: poetry run ruff check hierarchical_crew tests examples
      - name: ruff format --check
        run: poetry run ruff format --check hierarchical_crew tests examples
      - name: mypy
        run: poetry run mypy hierarchical_crew tests
      - name: bandit
        run: poetry run bandit -c pyproject.toml -q -r hierarchical_crew

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root --all-extras
      - name: pip-audit
        run: |
          # pip is tooling, not a shipped dependency: upgrade it so its own advisories don't fail the audit.
          poetry run python -m pip install --upgrade -q pip
          # Four chromadb server-side advisories with no fixed release (crewai pins chromadb~=1.5.9).
          # They need a running Chroma HTTP server; this project never starts one. See SECURITY.md.
          poetry run pip-audit \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --all-extras
      - name: Run pytest (fake model, sockets blocked)
        run: poetry run pytest -q
      - name: Quickstart example (three processes + flow, offline)
        run: poetry run python -m examples.quickstart
      - name: CLI smoke run (fake provider, flow with scripted feedback)
        run: |
          poetry run python -m hierarchical_crew --provider fake --feedback approve "Plan the launch of Aurora: segments, competitor pricing, price, tagline and risks." | tee out.txt
          grep -q "status=approved" out.txt
          grep -q "Pricing Analyst" out.txt
      - name: Benchmark smoke run (short latency, one repeat)
        run: poetry run python -m hierarchical_crew.bench --latency 0.01 --repeats 1
      - name: Build the wheel and check the bundled data is inside
        run: |
          poetry build -q
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for f in ("products.csv", "segments.csv", "competitors.csv", "py.typed"):
              assert any(n.endswith(f) for n in names), f
          print("wheel ok:", len(names), "files")
          PY
